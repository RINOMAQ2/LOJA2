<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rinomaq Entregas</title>
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f6fb;color:#172033} button,input,select,textarea{font:inherit} button{cursor:pointer}.hidden{display:none!important}
    .loginPage{min-height:100vh;display:grid;grid-template-columns:1.1fr 460px;gap:28px;align-items:center;padding:38px;background:radial-gradient(circle at top left,#6b5ad6,#241b5b 42%,#0f172a);color:#fff}.logo{display:flex;gap:14px;align-items:center}.logo img{width:82px;height:82px;object-fit:contain;border-radius:22px;background:#fff;padding:4px}.logo.small img{width:56px;height:56px}.logo strong{display:block;font-size:30px;letter-spacing:3px}.logo.small strong{font-size:22px;color:#2b2169}.logo span{display:block;font-size:12px;text-transform:uppercase;letter-spacing:1.1px;opacity:.85;margin-top:3px}.loginLeft h1{font-size:clamp(38px,5vw,68px);line-height:.95;max-width:760px;margin:38px 0 16px}.loginLeft p{font-size:19px;line-height:1.55;color:#dbe4ff;max-width:620px}.heroCards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:700px;margin-top:30px}.heroCards div{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);padding:18px;border-radius:22px}.heroCards strong{display:block;font-size:24px}.heroCards span{color:#dbe4ff}.loginCard{background:#fff;color:#172033;border-radius:30px;padding:28px;box-shadow:0 30px 100px rgba(0,0,0,.35)}.loginCard .logo{margin-bottom:20px}.loginCard label,.form label{font-weight:800;margin-bottom:5px;display:block}input,select,textarea{width:100%;border:1px solid #d7deea;border-radius:14px;padding:13px;background:#fff;outline:none;color:#172033}input:focus,select:focus,textarea:focus{border-color:#2b2169;box-shadow:0 0 0 3px rgba(43,33,105,.12)}.loginCard input{margin-bottom:13px}.primary{width:100%;border:0;border-radius:14px;padding:14px 16px;background:#2b2169;color:#fff;font-weight:900;box-shadow:0 10px 22px rgba(43,33,105,.2)}.access{margin-top:18px;background:#f1f5f9;color:#475569;padding:15px;border-radius:18px;display:grid;gap:5px}
    .app{min-height:100vh;display:grid;grid-template-columns:280px 1fr}.sidebar{background:#241b5b;color:#fff;padding:22px;display:flex;flex-direction:column;gap:28px}.sidebar nav{display:grid;gap:10px}.sidebar nav button{border:0;border-radius:16px;padding:14px;color:#fff;background:rgba(255,255,255,.1);text-align:left;font-weight:800}.sidebar nav button.active,.sidebar nav button:hover{background:#f4c542;color:#1f174f}.userBox{margin-top:auto;background:rgba(255,255,255,.12);border-radius:20px;padding:16px;display:grid;gap:8px}.userBox span{color:#dbe4ff}.userBox button{border:0;border-radius:12px;padding:11px;background:#fff;color:#241b5b;font-weight:900}.mapSelect{border:0;border-radius:12px;padding:10px;background:rgba(255,255,255,.95);color:#241b5b;font-weight:800}.main{padding:24px;overflow:auto}.topbar{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}.topbar h1{margin:0;font-size:34px}.topbar p{margin:7px 0 0;color:#64748b}.topbar select{width:190px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.metrics div{background:#fff;border-radius:22px;padding:19px;box-shadow:0 10px 30px rgba(15,23,42,.06)}.metrics span{color:#64748b;font-weight:800}.metrics strong{display:block;margin-top:8px;font-size:36px;color:#2b2169}.grid,.adminGrid{display:grid;grid-template-columns:minmax(320px,410px) 1fr;gap:18px;align-items:start}.panel{background:#fff;border-radius:24px;padding:20px;box-shadow:0 10px 30px rgba(15,23,42,.06)}.panel h2{margin:0 0 16px}.form{display:grid;gap:10px}.form textarea{min-height:86px;resize:vertical}.listHeader{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.listHeader span{background:#eef2ff;color:#2b2169;padding:7px 12px;border-radius:999px;font-weight:900}.list{display:grid;gap:14px}.delivery{border:1px solid #e2e8f0;border-radius:22px;padding:16px;background:#fbfdff}.delivery.expanded{border-color:#2b2169;box-shadow:0 10px 26px rgba(43,33,105,.12)}.deliveryTop{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.delivery small{color:#64748b;font-weight:900}.delivery h3{margin:5px 0;font-size:20px}.delivery p{margin:0;color:#64748b}.tapHint{display:block;margin-top:6px;color:#2b2169!important;font-weight:900}.tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.tag{display:inline-block;border-radius:999px;padding:6px 10px;color:#fff;font-size:12px;font-weight:900;background:#64748b}.emrota{background:#2563eb}.concluida{background:#16a34a}.pendente,.agendada{background:#f59e0b}.alta{background:#f97316}.urgente{background:#dc2626}.normal{background:#475569}.details{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.details div{background:#fff;border:1px solid #edf2f7;border-radius:16px;padding:12px}.details b{display:block;color:#64748b;font-size:12px;margin-bottom:5px}.details span{color:#334155;font-weight:800}.locationBox{background:#eef2ff;border:1px solid #c7d2fe;color:#1e1b4b;padding:12px;border-radius:16px;margin:12px 0;display:grid;gap:8px}.locationBox button{border:0;border-radius:12px;padding:11px;background:#2b2169;color:#fff;font-weight:900}.note{background:#fff7df;border:1px solid #fde68a;color:#713f12!important;padding:12px;border-radius:16px;margin-bottom:12px!important}.photoBox{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:16px;padding:12px;margin-bottom:12px}.photoHeader{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}.photoHeader span{color:#64748b;font-size:12px;font-weight:900}.photoButton{display:block;width:100%;border:0;border-radius:14px;padding:12px;background:#2b2169;color:#fff;font-weight:900;text-align:center}.photoButton input{display:none}.photoGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(95px,1fr));gap:10px;margin-top:12px}.photoPreview{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:7px}.photoPreview img{width:100%;height:80px;object-fit:cover;border-radius:10px;display:block}.photoPreview small{display:block;margin-top:5px;color:#64748b;font-size:10px}.actions,.userActions{display:flex;gap:8px;flex-wrap:wrap}.actions button,.userActions button{border:1px solid #cbd5e1;background:#fff;border-radius:12px;padding:10px 12px;font-weight:900}.actions .done{background:#16a34a;border-color:#16a34a;color:#fff}.usersList{display:grid;gap:12px}.userCard{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;border:1px solid #e2e8f0;border-radius:18px;padding:14px;background:#fbfdff}.userCard strong{display:block;font-size:17px}.userCard span{display:block;color:#64748b;font-weight:800;margin:3px 0}.userCard small{color:#2b2169;font-weight:900}.empty{padding:28px;text-align:center;background:#f8fafc;border-radius:18px;color:#64748b}
    @media(max-width:1050px){.loginPage{grid-template-columns:1fr}.app{grid-template-columns:1fr}.grid,.adminGrid{grid-template-columns:1fr}.details{grid-template-columns:1fr 1fr}}@media(max-width:700px){.loginPage{padding:18px}.heroCards,.metrics,.details{grid-template-columns:1fr}.topbar{flex-direction:column}.topbar select{width:100%}.deliveryTop,.userCard{grid-template-columns:1fr;display:grid}.loginLeft h1{font-size:40px}.main{padding:14px}}
  </style>
</head>
<body>
<div id="root"></div>
<script>
const mapas={google:'Google Maps',waze:'Waze'};
let usuarios=JSON.parse(localStorage.getItem('rinomaq_usuarios')||'null')||{admin:{senha:'123456',nome:'Admin Rinomaq',tipo:'admin',ativo:true},breno:{senha:'919293',nome:'Breno',tipo:'motorista',ativo:true},kleifor:{senha:'919293',nome:'Kleifor',tipo:'motorista',ativo:true}};
let entregas=JSON.parse(localStorage.getItem('rinomaq_entregas')||'null')||[{id:1001,tipo:'Entrega',cliente:'Obra Lumier',contato:'Marcio',endereco:'Norte da Ilha - Florianópolis/SC',equipamento:'40 escoras metálicas',motorista:'breno',periodo:'Hoje - 08:30',status:'Em rota',prioridade:'Alta',obs:'Conferir quantidade e coletar assinatura do responsável.',fotos:[]},{id:1002,tipo:'Retirada',cliente:'JF Construtora',contato:'Pedro',endereco:'Canasvieiras - Florianópolis/SC',equipamento:'Betoneira 400L + andaimes',motorista:'kleifor',periodo:'Hoje - 14:00',status:'Pendente',prioridade:'Normal',obs:'Retirar equipamentos no final da tarde.',fotos:[]}];
let sessao=null, menu='Painel', filtro='Todas', mapaPreferido='google', rotaAberta=null;
function save(){localStorage.setItem('rinomaq_usuarios',JSON.stringify(usuarios));localStorage.setItem('rinomaq_entregas',JSON.stringify(entregas));}
function norm(t){return (t||'').trim().toLowerCase().replace(/\s+/g,'')}
function logo(small=''){return `<div class="logo ${small}"><img src="RINOMAQ.jpg" onerror="this.style.display='none'"><div><strong>RINOMAQ</strong><span>A força que a sua obra precisa</span></div></div>`}
function tag(text){let c=String(text).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'').toLowerCase();return `<span class="tag ${c}">${text}</span>`}
function motoristas(){return Object.entries(usuarios).filter(([k,u])=>u.tipo==='motorista'&&u.ativo!==false)}
function entrar(e){e.preventDefault();let u=norm(document.getElementById('loginUser').value),s=document.getElementById('loginPass').value;if(!usuarios[u]||usuarios[u].ativo===false||usuarios[u].senha!==s){alert('Usuário ou senha inválidos');return}sessao={usuario:u,...usuarios[u]};render()}
function sair(){sessao=null;render()}
function abrirMenu(m){menu=m;render()}
function setFiltro(v){filtro=v;render()}
function setMapa(v){mapaPreferido=v;render()}
function rotas(){let base=sessao.tipo==='admin'?entregas:entregas.filter(e=>e.motorista===sessao.usuario);if(filtro!=='Todas')base=base.filter(e=>e.status===filtro);if(menu==='Entregas')base=base.filter(e=>e.tipo==='Entrega');if(menu==='Retiradas')base=base.filter(e=>e.tipo==='Retirada');return base}
function criarEntrega(e){e.preventDefault();let f=new FormData(e.target), obj=Object.fromEntries(f.entries());if(!obj.cliente||!obj.endereco||!obj.equipamento){alert('Preencha cliente, endereço e equipamento');return}entregas.unshift({id:Date.now(),status:'Agendada',fotos:[],...obj});save();e.target.reset();render()}
function cadastrarUsuario(e){e.preventDefault();let f=new FormData(e.target), obj=Object.fromEntries(f.entries()), chave=norm(obj.usuario);if(!obj.nome||!chave||!obj.senha){alert('Preencha nome, usuário e senha');return}if(usuarios[chave]){alert('Já existe usuário com esse login');return}usuarios[chave]={nome:obj.nome,senha:obj.senha,tipo:obj.tipo,ativo:true};save();e.target.reset();alert('Usuário cadastrado');render()}
function alternarUsuario(chave){if(chave==='admin'){alert('Admin principal não pode ser desativado');return}usuarios[chave].ativo=usuarios[chave].ativo===false;save();render()}
function removerUsuario(chave){if(chave==='admin'){alert('Admin principal não pode ser removido');return}if(entregas.some(e=>e.motorista===chave)){alert('Motorista possui entregas vinculadas. Desative em vez de remover.');return}delete usuarios[chave];save();render()}
function mudarStatus(id,st){entregas=entregas.map(e=>e.id==id?{...e,status:st}:e);save();render()}
function abrirNav(end){let d=encodeURIComponent(end);window.open(mapaPreferido==='waze'?`https://waze.com/ul?q=${d}&navigate=yes`:`https://www.google.com/maps/dir/?api=1&destination=${d}`,'_blank')}
function foto(id,input){let file=input.files&&input.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{entregas=entregas.map(e=>e.id==id?{...e,fotos:[...(e.fotos||[]),{id:Date.now(),url:r.result,nome:file.name,data:new Date().toLocaleString('pt-BR')}]}:e);save();render()};r.readAsDataURL(file)}
function toggleRota(id){if(sessao.tipo==='motorista'){rotaAberta=rotaAberta===id?null:id;render()}}
function renderLogin(){document.getElementById('root').innerHTML=`<div class="loginPage"><div class="loginLeft">${logo()}<h1>Gestão de entregas e retiradas para construção civil</h1><p>Organize rotas, equipamentos, motoristas e status das entregas da Rinomaq em uma tela simples e profissional.</p><div class="heroCards"><div><strong>Rotas</strong><span>entrega e retirada</span></div><div><strong>Usuários</strong><span>admin e motoristas</span></div><div><strong>Fotos</strong><span>coleta e entrega</span></div></div></div><form class="loginCard" onsubmit="entrar(event)">${logo('small')}<h2>Acessar sistema</h2><label>Usuário</label><input id="loginUser" value="admin"><label>Senha</label><input id="loginPass" type="password" value="123456"><button class="primary">Entrar</button><div class="access"><b>Acessos</b><span>admin / 123456</span><span>breno / 919293</span><span>kleifor / 919293</span></div></form></div>`}
function formEntrega(){return `<form class="panel form" onsubmit="criarEntrega(event)"><h2>Nova entrega/retirada</h2><select name="tipo"><option>Entrega</option><option>Retirada</option></select><input name="cliente" placeholder="Cliente ou obra"><input name="contato" placeholder="Contato na obra"><input name="endereco" placeholder="Endereço completo"><input name="equipamento" placeholder="Equipamento/material"><select name="motorista">${motoristas().map(([k,u])=>`<option value="${k}">${u.nome}</option>`).join('')}</select><input name="periodo" placeholder="Período. Ex: Hoje - 08:00" value="Hoje - 08:00"><select name="prioridade"><option>Normal</option><option>Alta</option><option>Urgente</option></select><textarea name="obs" placeholder="Observações para o motorista"></textarea><button class="primary">Cadastrar rota</button></form>`}
function listaRotas(){let lista=rotas();return `<section class="panel"><div class="listHeader"><h2>${sessao.tipo==='admin'?'Rotas cadastradas':'Minhas rotas'}</h2><span>${lista.length} registros</span></div><div class="list">${lista.length?lista.map(item=>{let aberto=rotaAberta===item.id,show=sessao.tipo==='admin'||aberto;return `<article class="delivery ${aberto?'expanded':''}" onclick="toggleRota(${item.id})"><div class="deliveryTop"><div><small>#${item.id} • ${item.tipo}</small><h3>${item.cliente}</h3><p>${item.endereco}</p>${sessao.tipo==='motorista'?'<small class="tapHint">Toque no cartão para ver localização e navegação</small>':''}</div><div class="tags">${tag(item.status)}${tag(item.prioridade)}</div></div><div class="details"><div><b>Equipamento</b><span>${item.equipamento}</span></div><div><b>Motorista</b><span>${usuarios[item.motorista]?.nome||item.motorista}</span></div><div><b>Período</b><span>${item.periodo||''}</span></div><div><b>Contato</b><span>${item.contato||'Não informado'}</span></div></div>${show?`<div class="locationBox" onclick="event.stopPropagation()"><b>📍 Localização da ${item.tipo.toLowerCase()}</b><span>${item.endereco}</span><button onclick="abrirNav('${String(item.endereco).replace(/'/g,"\\'")}')">Abrir no ${mapas[mapaPreferido]}</button></div>`:''}<p class="note">${item.obs||'Sem observações.'}</p><div class="photoBox" onclick="event.stopPropagation()"><div class="photoHeader"><b>Fotos da ${item.tipo.toLowerCase()}</b><span>${(item.fotos||[]).length} foto(s)</span></div><label class="photoButton">📷 Tirar/enviar foto da coleta ou entrega<input type="file" accept="image/*" capture="environment" onchange="foto(${item.id},this)"></label>${(item.fotos||[]).length?`<div class="photoGrid">${item.fotos.map(f=>`<div class="photoPreview"><img src="${f.url}"><small>${f.data}</small></div>`).join('')}</div>`:''}</div><div class="actions" onclick="event.stopPropagation()"><button onclick="mudarStatus(${item.id},'Pendente')">Pendente</button><button onclick="mudarStatus(${item.id},'Em rota')">Em rota</button><button class="done" onclick="mudarStatus(${item.id},'Concluída')">Concluir</button></div></article>`}).join(''):'<div class="empty">Nenhuma rota encontrada.</div>'}</div></section>`}
function painelUsuarios(){return `<section class="adminGrid"><form class="panel form" onsubmit="cadastrarUsuario(event)"><h2>Cadastrar usuário/motorista</h2><label>Nome completo</label><input name="nome" placeholder="Ex: João da Silva"><label>Usuário de acesso</label><input name="usuario" placeholder="Ex: joao"><label>Senha</label><input name="senha" placeholder="Ex: 123456"><label>Tipo de acesso</label><select name="tipo"><option value="motorista">Motorista</option><option value="admin">Administrador</option></select><button class="primary">Cadastrar usuário</button></form><section class="panel"><div class="listHeader"><h2>Usuários cadastrados</h2><span>${Object.keys(usuarios).length} usuários</span></div><div class="usersList">${Object.entries(usuarios).map(([k,u])=>`<article class="userCard"><div><strong>${u.nome}</strong><span>@${k}</span><small>${u.tipo==='admin'?'Administrador':'Motorista'}</small></div>${tag(u.ativo===false?'Inativo':'Ativo')}<div class="userActions"><button onclick="alternarUsuario('${k}')">${u.ativo===false?'Ativar':'Desativar'}</button><button onclick="removerUsuario('${k}')">Remover</button></div></article>`).join('')}</div></section></section>`}
function renderApp(){let isUsers=(menu==='Usuários'||menu==='Motoristas')&&sessao.tipo==='admin';let content=isUsers?painelUsuarios():`<section class="grid">${sessao.tipo==='admin'?formEntrega():''}${listaRotas()}</section>`;document.getElementById('root').innerHTML=`<div class="app"><aside class="sidebar">${logo('small')}<nav>${['Painel','Entregas','Retiradas','Motoristas','Usuários'].map(m=>`<button class="${menu===m?'active':''}" onclick="abrirMenu('${m}')">${m}</button>`).join('')}</nav><div class="userBox"><b>${sessao.nome}</b><span>${sessao.tipo==='admin'?'Administrador':'Motorista'}</span>${sessao.tipo==='motorista'?`<select class="mapSelect" onchange="setMapa(this.value)"><option value="google" ${mapaPreferido==='google'?'selected':''}>Google Maps</option><option value="waze" ${mapaPreferido==='waze'?'selected':''}>Waze</option></select>`:''}<button onclick="sair()">Sair</button></div></aside><main class="main"><header class="topbar"><div><h1>${menu==='Painel'?'Central de Operações':menu}</h1><p>A força que a sua obra precisa — entregas, retiradas, usuários e motoristas em controle.</p></div><select onchange="setFiltro(this.value)">${['Todas','Agendada','Pendente','Em rota','Concluída'].map(f=>`<option ${filtro===f?'selected':''}>${f}</option>`).join('')}</select></header><section class="metrics"><div><span>Total de rotas</span><strong>${entregas.length}</strong></div><div><span>Abertas</span><strong>${entregas.filter(e=>e.status!=='Concluída').length}</strong></div><div><span>Motoristas ativos</span><strong>${motoristas().length}</strong></div><div><span>Concluídas</span><strong>${entregas.filter(e=>e.status==='Concluída').length}</strong></div></section>${content}</main></div>`}
function render(){sessao?renderApp():renderLogin()} render();
</script>
</body>
</html>
