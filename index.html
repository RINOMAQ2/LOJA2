<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rinomaq Entregas</title>
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f6fb;color:#172033} button,input,select,textarea{font:inherit} button{cursor:pointer}.hidden{display:none!important}
    .login{min-height:100vh;display:grid;grid-template-columns:1.1fr 440px;gap:28px;align-items:center;padding:36px;background:radial-gradient(circle at top left,#6b5ad6,#241b5b 44%,#0f172a);color:#fff}.logo{display:flex;gap:14px;align-items:center}.logo img{width:76px;height:76px;object-fit:cover;border-radius:50%;background:white}.logo strong{display:block;font-size:30px;letter-spacing:3px}.logo span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px;opacity:.85}.login h1{font-size:clamp(38px,5vw,66px);line-height:.96;max-width:760px;margin:35px 0 14px}.login p{color:#dbe4ff;font-size:19px;line-height:1.55;max-width:650px}.hero{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:700px;margin-top:28px}.hero div{padding:18px;border-radius:22px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18)}.hero strong{display:block;font-size:23px}.card{background:#fff;color:#172033;border-radius:28px;padding:26px;box-shadow:0 28px 90px rgba(0,0,0,.34)}.card .logo{color:#2b2169;margin-bottom:22px}.card .logo img{width:60px;height:60px}.card h2{margin:0 0 18px;font-size:28px}label{font-weight:800;display:block;margin:10px 0 6px}input,select,textarea{width:100%;border:1px solid #d7deea;border-radius:14px;padding:13px;outline:none;background:#fff;color:#172033}textarea{min-height:86px;resize:vertical}.btn{border:0;border-radius:14px;padding:13px 15px;background:#2b2169;color:white;font-weight:900}.btn.full{width:100%;margin-top:14px}.access{margin-top:17px;padding:14px;border-radius:18px;background:#f1f5f9;color:#475569;display:grid;gap:5px}.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}.side{background:#241b5b;color:white;padding:22px;display:flex;flex-direction:column;gap:26px}.side .logo img{width:58px;height:58px}.side .logo strong{font-size:22px}.side nav{display:grid;gap:10px}.side nav button{border:0;border-radius:16px;padding:14px;background:rgba(255,255,255,.10);color:white;text-align:left;font-weight:900}.side nav button.active,.side nav button:hover{background:#f4c542;color:#1f174f}.userbox{margin-top:auto;background:rgba(255,255,255,.12);border-radius:20px;padding:16px;display:grid;gap:8px}.userbox span{color:#dbe4ff}.userbox button{border:0;border-radius:12px;padding:11px;background:white;color:#241b5b;font-weight:900}.main{padding:24px;overflow:auto}.top{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:18px}.top h1{margin:0;font-size:34px}.top p{margin:6px 0 0;color:#64748b}.top select{width:190px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.metric{background:#fff;border-radius:22px;padding:19px;box-shadow:0 10px 30px rgba(15,23,42,.06)}.metric span{color:#64748b;font-weight:800}.metric strong{display:block;margin-top:8px;font-size:36px;color:#2b2169}.grid{display:grid;grid-template-columns:minmax(320px,410px) 1fr;gap:18px;align-items:start}.panel{background:#fff;border-radius:24px;padding:20px;box-shadow:0 10px 30px rgba(15,23,42,.06)}.panel h2{margin:0 0 16px}.form{display:grid;gap:10px}.listHead{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.listHead span{background:#eef2ff;color:#2b2169;padding:7px 12px;border-radius:999px;font-weight:900}.list{display:grid;gap:14px}.delivery{border:1px solid #e2e8f0;border-radius:22px;padding:16px;background:#fbfdff}.delivery.expanded{border-color:#2b2169;box-shadow:0 10px 26px rgba(43,33,105,.12)}.deliveryTop{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.delivery small{color:#64748b;font-weight:900}.delivery h3{margin:5px 0;font-size:20px}.delivery p{margin:0;color:#64748b}.tap{display:block;margin-top:6px;color:#2b2169!important;font-weight:900}.tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.tag{display:inline-block;border-radius:999px;padding:6px 10px;color:white;font-size:12px;font-weight:900;background:#64748b}.emrota{background:#2563eb}.concluida{background:#16a34a}.pendente,.agendada{background:#f59e0b}.alta{background:#f97316}.urgente{background:#dc2626}.normal{background:#475569}.details{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.details div{background:white;border:1px solid #edf2f7;border-radius:16px;padding:12px}.details b{display:block;color:#64748b;font-size:12px;margin-bottom:5px}.details span{color:#334155;font-weight:800}.location{background:#eef2ff;border:1px solid #c7d2fe;color:#1e1b4b;padding:12px;border-radius:16px;margin:12px 0;display:grid;gap:8px}.location span{color:#334155;font-weight:800}.location button{border:0;border-radius:12px;padding:11px;background:#2b2169;color:white;font-weight:900}.note{background:#fff7df;border:1px solid #fde68a;color:#713f12!important;padding:12px;border-radius:16px;margin-bottom:12px!important}.photo{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:16px;padding:12px;margin-bottom:12px}.photoHead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}.photoBtn{display:block;width:100%;border-radius:14px;padding:12px;background:#2b2169;color:white;font-weight:900;text-align:center}.photoBtn input{display:none}.photoGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(95px,1fr));gap:10px;margin-top:12px}.photoPrev{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:7px}.photoPrev img{width:100%;height:80px;object-fit:cover;border-radius:10px;display:block}.photoPrev small{display:block;margin-top:5px;color:#64748b;font-size:10px}.actions,.userActions{display:flex;gap:8px;flex-wrap:wrap}.actions button,.userActions button{border:1px solid #cbd5e1;background:white;border-radius:12px;padding:10px 12px;font-weight:900}.actions .done{background:#16a34a;border-color:#16a34a;color:white}.userCard{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;border:1px solid #e2e8f0;border-radius:18px;padding:14px;background:#fbfdff;margin-bottom:12px}.userCard strong{display:block;font-size:17px}.userCard span{display:block;color:#64748b;font-weight:800;margin:3px 0}.userCard small{color:#2b2169;font-weight:900}@media(max-width:1050px){.login{grid-template-columns:1fr}.app{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.details{grid-template-columns:1fr 1fr}}@media(max-width:700px){.login{padding:18px}.hero,.metrics,.details{grid-template-columns:1fr}.top{flex-direction:column}.top select{width:100%}.deliveryTop,.userCard{display:grid;grid-template-columns:1fr}.login h1{font-size:40px}}
  </style>
</head>
<body>
<div id="root"></div>
<script>
const mapas={google:'Google Maps',waze:'Waze'};
let usuarios=JSON.parse(localStorage.getItem('rinomaq_usuarios')||'null')||{admin:{senha:'123456',nome:'Admin Rinomaq',tipo:'admin',ativo:true},breno:{senha:'919293',nome:'Breno',tipo:'motorista',ativo:true},kleifor:{senha:'919293',nome:'Kleifor',tipo:'motorista',ativo:true}};
let entregas=JSON.parse(localStorage.getItem('rinomaq_entregas')||'null')||[{id:1001,tipo:'Entrega',cliente:'Obra Lumier',contato:'Marcio',endereco:'Norte da Ilha - Florianópolis/SC',equipamento:'40 escoras metálicas',motorista:'breno',periodo:'Hoje - 08:30',status:'Em rota',prioridade:'Alta',obs:'Conferir quantidade e coletar assinatura do responsável.',fotos:[]},{id:1002,tipo:'Retirada',cliente:'JF Construtora',contato:'Pedro',endereco:'Canasvieiras - Florianópolis/SC',equipamento:'Betoneira 400L + andaimes',motorista:'kleifor',periodo:'Hoje - 14:00',status:'Pendente',prioridade:'Normal',obs:'Retirar equipamentos no final da tarde.',fotos:[]}];
let sessao=null,menu='Painel',filtro='Todas',mapaPreferido='google',rotaAberta=null;
const root=document.getElementById('root');
function save(){localStorage.setItem('rinomaq_usuarios',JSON.stringify(usuarios));localStorage.setItem('rinomaq_entregas',JSON.stringify(entregas));}
function norm(t){return (t||'').trim().toLowerCase().replace(/\s+/g,'')}
function logo(small=''){return `<div class="logo ${small}"><img src="RINOMAQ.jpg" alt="Rinomaq"><div><strong>RINOMAQ</strong><span>A força que a sua obra precisa</span></div></div>`}
function tag(txt,tipo){return `<span class="tag ${String(tipo||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ /g,'').toLowerCase()}">${txt}</span>`}
function listaFiltrada(){if(!sessao)return[];let l=sessao.tipo==='admin'?entregas:entregas.filter(e=>e.motorista===sessao.usuario);if(filtro!=='Todas')l=l.filter(e=>e.status===filtro);if(menu==='Entregas')l=l.filter(e=>e.tipo==='Entrega');if(menu==='Retiradas')l=l.filter(e=>e.tipo==='Retirada');return l}
function render(){if(!sessao)return renderLogin();renderApp()}
function renderLogin(){root.innerHTML=`<section class="login"><div><div>${logo()}</div><h1>Gestão de entregas e retiradas para construção civil</h1><p>Organize rotas, equipamentos, motoristas e status das entregas da Rinomaq em uma tela simples e profissional.</p><div class="hero"><div><strong>Rotas</strong><span>entrega e retirada</span></div><div><strong>Usuários</strong><span>admin e motoristas</span></div><div><strong>Fotos</strong><span>coleta e entrega</span></div></div></div><form class="card" onsubmit="login(event)">${logo('small')}<h2>Acessar sistema</h2><label>Usuário</label><input id="loginUser" value="admin"><label>Senha</label><input id="loginPass" type="password" value="123456"><button class="btn full">Entrar</button><div class="access"><b>Acessos</b><span>admin / 123456</span><span>breno / 919293</span><span>kleifor / 919293</span></div></form></section>`}
function renderApp(){let l=listaFiltrada();let motoristas=Object.entries(usuarios).filter(([,d])=>d.tipo==='motorista'&&d.ativo!==false);let abertas=entregas.filter(e=>e.status!=='Concluída').length,rota=entregas.filter(e=>e.status==='Em rota').length,conc=entregas.filter(e=>e.status==='Concluída').length;root.innerHTML=`<div class="app"><aside class="side">${logo('small')}<nav>${['Painel','Entregas','Retiradas','Motoristas','Usuários'].map(x=>`<button class="${menu===x?'active':''}" onclick="setMenu('${x}')">${x}</button>`).join('')}</nav><div class="userbox"><b>${sessao.nome}</b><span>${sessao.tipo==='admin'?'Administrador':'Motorista'}</span>${sessao.tipo==='motorista'?`<select onchange="mapaPreferido=this.value"><option value="google">Google Maps</option><option value="waze">Waze</option></select>`:''}<button onclick="sair()">Sair</button></div></aside><main class="main"><header class="top"><div><h1>${menu==='Painel'?'Central de Operações':menu}</h1><p>A força que a sua obra precisa — entregas, retiradas, usuários e motoristas em controle.</p></div><select onchange="filtro=this.value;render()">${['Todas','Agendada','Pendente','Em rota','Concluída'].map(x=>`<option ${filtro===x?'selected':''}>${x}</option>`).join('')}</select></header><section class="metrics"><div class="metric"><span>Total de rotas</span><strong>${entregas.length}</strong></div><div class="metric"><span>Abertas</span><strong>${abertas}</strong></div><div class="metric"><span>Motoristas ativos</span><strong>${motoristas.length}</strong></div><div class="metric"><span>Concluídas</span><strong>${conc}</strong></div></section>${(menu==='Usuários'||menu==='Motoristas')&&sessao.tipo==='admin'?usuariosView():rotasView(l,motoristas)}</main></div>`}
function usuariosView(){return `<section class="grid"><form class="panel form" onsubmit="cadastrarUsuario(event)"><h2>Cadastrar usuário/motorista</h2><label>Nome completo</label><input id="unome" placeholder="Ex: João"><label>Usuário de acesso</label><input id="uuser" placeholder="Ex: joao"><label>Senha</label><input id="usenha" placeholder="Ex: 123456"><label>Tipo</label><select id="utipo"><option value="motorista">Motorista</option><option value="admin">Administrador</option></select><button class="btn full">Cadastrar usuário</button></form><section class="panel"><div class="listHead"><h2>Usuários cadastrados</h2><span>${Object.keys(usuarios).length} usuários</span></div>${Object.entries(usuarios).map(([k,d])=>`<article class="userCard"><div><strong>${d.nome}</strong><span>@${k}</span><small>${d.tipo==='admin'?'Administrador':'Motorista'}</small></div>${tag(d.ativo===false?'Inativo':'Ativo',d.ativo===false?'pendente':'concluida')}<div class="userActions"><button onclick="alternarUsuario('${k}')">${d.ativo===false?'Ativar':'Desativar'}</button><button onclick="removerUsuario('${k}')">Remover</button></div></article>`).join('')}</section></section>`}
function rotasView(l,motoristas){return `<section class="grid">${sessao.tipo==='admin'?`<form class="panel form" onsubmit="criarEntrega(event)"><h2>Nova entrega/retirada</h2><select id="tipo"><option>Entrega</option><option>Retirada</option></select><input id="cliente" placeholder="Cliente ou obra"><input id="contato" placeholder="Contato na obra"><input id="endereco" placeholder="Endereço completo"><input id="equipamento" placeholder="Equipamento/material"><select id="motorista">${motoristas.map(([k,d])=>`<option value="${k}">${d.nome}</option>`).join('')}</select><input id="periodo" value="Hoje - 08:00"><select id="prioridade"><option>Normal</option><option>Alta</option><option>Urgente</option></select><textarea id="obs" placeholder="Observações para o motorista"></textarea><button class="btn full">Cadastrar rota</button></form>`:''}<section class="panel"><div class="listHead"><h2>${sessao.tipo==='admin'?'Rotas cadastradas':'Minhas rotas'}</h2><span>${l.length} registros</span></div><div class="list">${l.map(cardRota).join('')}</div></section></section>`}
function cardRota(item){let aberto=rotaAberta===item.id,loc=sessao.tipo==='admin'||aberto;return `<article class="delivery ${aberto?'expanded':''}" onclick="${sessao.tipo==='motorista'?`toggleRota(${item.id})`:''}"><div class="deliveryTop"><div><small>#${item.id} • ${item.tipo}</small><h3>${item.cliente}</h3><p>${item.endereco}</p>${sessao.tipo==='motorista'?'<small class="tap">Toque no cartão para ver localização e navegação</small>':''}</div><div class="tags">${tag(item.status,item.status)}${tag(item.prioridade,item.prioridade)}</div></div><div class="details"><div><b>Equipamento</b><span>${item.equipamento}</span></div><div><b>Motorista</b><span>${usuarios[item.motorista]?.nome||item.motorista}</span></div><div><b>Período</b><span>${item.periodo}</span></div><div><b>Contato</b><span>${item.contato||'Não informado'}</span></div></div>${loc?`<div class="location" onclick="event.stopPropagation()"><b>📍 Localização da ${item.tipo.toLowerCase()}</b><span>${item.endereco}</span><button onclick="abrirNavegacao('${encodeURIComponent(item.endereco)}')">Abrir no ${mapas[mapaPreferido]}</button></div>`:''}<p class="note">${item.obs||'Sem observações.'}</p><div class="photo" onclick="event.stopPropagation()"><div class="photoHead"><b>Fotos da ${item.tipo.toLowerCase()}</b><span>${(item.fotos||[]).length} foto(s)</span></div><label class="photoBtn">📷 Tirar/enviar foto da coleta ou entrega<input type="file" accept="image/*" capture="environment" onchange="adicionarFoto(${item.id},this.files[0])"></label>${(item.fotos||[]).length?`<div class="photoGrid">${item.fotos.map(f=>`<div class="photoPrev"><img src="${f.url}"><small>${f.data}</small></div>`).join('')}</div>`:''}</div><div class="actions" onclick="event.stopPropagation()"><button onclick="mudarStatus(${item.id},'Pendente')">Pendente</button><button onclick="mudarStatus(${item.id},'Em rota')">Em rota</button><button class="done" onclick="mudarStatus(${item.id},'Concluída')">Concluir</button></div></article>`}
function login(e){e.preventDefault();let u=norm(document.getElementById('loginUser').value),p=document.getElementById('loginPass').value;if(!usuarios[u]||usuarios[u].ativo===false||usuarios[u].senha!==p)return alert('Usuário ou senha inválidos.');sessao={usuario:u,...usuarios[u]};render()}
function sair(){sessao=null;render()} function setMenu(m){menu=m;render()} function toggleRota(id){rotaAberta=rotaAberta===id?null:id;render()}
function abrirNavegacao(end){let destino=decodeURIComponent(end),url=mapaPreferido==='waze'?`https://waze.com/ul?q=${encodeURIComponent(destino)}&navigate=yes`:`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(destino)}`;window.open(url,'_blank')}
function criarEntrega(e){e.preventDefault();let nova={id:Date.now(),tipo:tipo.value,cliente:cliente.value,contato:contato.value,endereco:endereco.value,equipamento:equipamento.value,motorista:motorista.value,periodo:periodo.value,prioridade:prioridade.value,obs:obs.value,status:'Agendada',fotos:[]};if(!nova.cliente||!nova.endereco||!nova.equipamento)return alert('Preencha cliente, endereço e equipamento.');entregas=[nova,...entregas];save();render()}
function cadastrarUsuario(e){e.preventDefault();let k=norm(uuser.value);if(!unome.value||!k||!usenha.value)return alert('Preencha nome, usuário e senha.');if(usuarios[k])return alert('Já existe um usuário com esse login.');usuarios[k]={nome:unome.value,senha:usenha.value,tipo:utipo.value,ativo:true};save();alert('Usuário cadastrado com sucesso.');render()}
function alternarUsuario(k){if(k==='admin')return alert('O admin principal não pode ser desativado.');usuarios[k].ativo=usuarios[k].ativo===false;save();render()} function removerUsuario(k){if(k==='admin')return alert('O admin principal não pode ser removido.');if(entregas.some(e=>e.motorista===k))return alert('Esse motorista possui entregas vinculadas. Desative em vez de remover.');delete usuarios[k];save();render()}
function mudarStatus(id,status){entregas=entregas.map(e=>e.id===id?{...e,status}:e);save();render()} function adicionarFoto(id,arquivo){if(!arquivo)return;let r=new FileReader();r.onload=()=>{entregas=entregas.map(e=>e.id===id?{...e,fotos:[...(e.fotos||[]),{id:Date.now(),nome:arquivo.name,url:r.result,data:new Date().toLocaleString('pt-BR')}]}:e);save();render()};r.readAsDataURL(arquivo)}
render();
</script>
</body>
</html>
